# Platform configuration - the only place where we type in names.
# Read by uc_bootstrap.load_config() (UC bootstrap) and by 00_kickoff.ipynb (volume paths).
#
# Rules for all names: lower snake_case, i.e. lowercase letters, digits and "_",
# starting with a letter. A hyphen, space or uppercase letter will stop the script already in dry-run.
#
# YAML trap: unquoted yes/no/on/off/true/false are booleans, not strings.
# A system named "no" would have to be written in quotes: "no". The loader detects this and reports an error.

# Prefix of all catalogs: <project>_sources, <project>_dev, <project>_prod.
project: moustache_markt

# Each environment gets its own catalog with an identical schema structure.
environments:
  - dev
  - prod

# Source systems: a volume in <project>_sources.landing + a bronze_<system> schema in every env.
# S1 only for now. Add S2/S3 systems when they are needed: pricing, rma, wms, ref, web, mkt
source_systems:
  - erp
  - crm
  - ecom
  - pos

# Medallion layers shared by all systems - one schema each in every env.
curated_layers:
  - silver
  - gold
